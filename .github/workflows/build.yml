name: Build Windows EXE

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release exe
        run: cargo build --release
      - name: Package zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path win-dist
          Copy-Item target/release/bigdata-bg-remover.exe win-dist/BigDataBGRemover.exe
          if (Test-Path target/release/*.dll) {
            Copy-Item target/release/*.dll win-dist/
          }
          Compress-Archive -Path win-dist/* -DestinationPath BigDataBGRemover-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BigDataBGRemover-windows-x86_64
          path: BigDataBGRemover-windows-x86_64.zip
